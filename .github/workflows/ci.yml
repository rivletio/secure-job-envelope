name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run demo
      # The dev server too: it was broken for a long time (every request a 500) while
      # the production build stayed green, because nothing here ever started it.
      - run: npm run dev:smoke
      # The static artifacts the Pages workflow publishes (demo site + desk SPA).
      # Built here too so a change that breaks the deployable output fails on the
      # pull request, not for the first time inside the deploy.
      - run: npm run site:build
      - run: npm run desk:build
      - run: node scripts/build-pages.mjs _pages

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/secure-job-envelope
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --locked: build exactly the dependency set in Cargo.lock (the one the
      # advisory audit scans); fail rather than silently re-resolve.
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Cross-implementation hardening: soak the lifecycle for invariant breaks, then
  # run the TS<->Rust differential fuzzer (same random documents to both cores,
  # comparing parse/hash/level/bound) and confirm the committed fuzz corpus is
  # still what the generator produces. Needs both toolchains in one job.
  crossimpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: build the Rust CLI (the differential's other half)
        working-directory: crates/secure-job-envelope
        run: cargo build --release --locked
      - name: soak the lifecycle + adversarial battery
        run: npm run soak -- --jobs 500
      # Every case is exact wire bytes, handed to both sides. One Rust process per
      # case, split across the runner's cores; any divergence, crash or stall fails.
      - name: TS<->Rust differential fuzz
        run: npm run differential -- --seeds 20000 --quiet
      # `git status --porcelain` (not `git diff`): the corpus is one file per case, and
      # a case the generator newly adds is an untracked file.
      - name: committed fuzz corpus is up to date with the generator
        run: |
          npm run corpus
          drift="$(git status --porcelain conformance/fuzz/)"
          [ -z "$drift" ] || { echo "conformance/fuzz is stale — run 'npm run corpus' and commit:"; echo "$drift"; exit 1; }
      # The generated conformance vectors (canonical, travelers + expected.json, and
      # every signature / envelope vector) must be exactly what the generator emits:
      # a vector added by hand is silently dropped the next time someone regenerates,
      # and a generator change that alters a vector must show up in review.
      # `git status --porcelain` (not `git diff`) so a NEW untracked file fails too.
      - name: committed conformance vectors are what the generator produces
        run: |
          node --experimental-strip-types conformance/generate.ts > /dev/null
          drift="$(git status --porcelain conformance/)"
          [ -z "$drift" ] || { echo "conformance/ differs from the generator's output:"; echo "$drift"; \
            echo "run 'node --experimental-strip-types conformance/generate.ts' and commit"; exit 1; }

# Dependency advisories are checked by .github/workflows/audit.yml (blocking, and
# on a weekly schedule so a new advisory surfaces without waiting for a push).
