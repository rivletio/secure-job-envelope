[package]
name = "opentraveler"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "OpenTraveler 0.0.1 — content-addressed job envelope for one part family"
repository = "https://github.com/rivletio/opentraveler"
homepage = "https://opentraveler.org"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[[bin]]
name = "traveler"
path = "src/main.rs"
