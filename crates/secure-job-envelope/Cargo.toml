[package]
name = "secure-job-envelope"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Secure Job Envelope (SJE) 0.1.0 — content-addressed job envelope for one part family"
repository = "https://github.com/rivletio/sje"
homepage = "https://securejobenvelope.org"

[dependencies]
aes-gcm = "0.11.1"
hex = "0.4"
hkdf = "0.13.0"
ml-dsa = "0.1.1"
ml-kem = "0.3.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse f64 to the correctly-rounded nearest value, matching
# ECMAScript JSON.parse / V8. Without it serde's fast path can land 1 ULP off,
# so a long-decimal thickness_mm would hash differently across implementations
# (the only float in the quoteable body). Required for cross-impl hash parity.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
thiserror = "1"

[[bin]]
name = "envelope"
path = "src/main.rs"
