[package]
name = "rivlet-packet"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Rivlet Packet 0.0.1 — content-addressed job envelope for one part family"
repository = "https://github.com/rivletio/rivlet-packet"
homepage = "https://packet.rivlet.io"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[[bin]]
name = "rivlet-packet"
path = "src/main.rs"
